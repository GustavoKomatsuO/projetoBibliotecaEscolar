<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - IGP3</title>
    <link rel="stylesheet" th:href="@{/login.css}">
</head>
<body>
<article class="login-card">
    <h1>IGP3</h1>
    <p>Para logar use seu CPF e senha</p>

    <p th:if="${erro}" th:text="${erro}" style="color: red;"></p>
    <p th:if="${sucesso}" th:text="${sucesso}" style="color: green;"></p>

    <form th:action="@{/autenticar}" method="post">
        <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="actions">
            <button type="submit" class="btn-submit">Entrar</button>

            <a th:href="@{/cadastrar}" class="btn-submit">Cadastro</a>

            <a href="#" class="forgot-link">Caso esqueça a senha</a>
        </div>
    </form>

    <p class="footer-text">Peço que entre em contato com o suporte</p>
</article>

<script>
    const inputCpfLogin = document.getElementById('cpf');

    if (inputCpfLogin) {
        inputCpfLogin.addEventListener('input', function (e) {
            let valor = e.target.value.replace(/\D/g, '');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = valor;
        });
    }
</script>
</body>
</html>
