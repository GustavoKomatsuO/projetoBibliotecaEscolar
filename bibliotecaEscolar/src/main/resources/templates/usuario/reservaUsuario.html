<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Reserva - IGP3</title>
    <link rel="stylesheet" th:href="@{/usuario/reservaUsuario.css}">
</head>
<body>

<header class="header-content">
    <h1>IGP3 - Efetuar Reserva</h1>
</header>

<div class="content-wrapper">
    <div class="box">
        <h2>Confirmar Reserva de Livro</h2>
        <p><strong>Livro Selecionado:</strong> <span th:text="${livro.titulo}"></span></p>
        <p><strong>Autor:</strong> <span th:text="${livro.autor}"></span></p>

        <form th:action="@{/usuario/efetuar-reserva}" method="post">
            <input type="hidden" name="isbn" th:value="${livro.isbn}" />

            <div class="date-picker-group">
                <label for="dataReserva">Escolha a data em que deseja realizar a reserva:</label>
                <input type="date" id="dataReserva" name="dataReserva" th:min="${dataMinima}" required />
            </div>

            <div class="rule-box">
                <strong>Regra da Biblioteca:</strong><br><br>
                A reserva acontece online. Quando o livro retornar da devolução, o sistema avisará o bibliotecário e o status mudará para Aguardando Retirada (prazo de 48 horas).
            </div>

            <button type="submit" class="btn-submit">Confirmar Reserva</button>
            <a th:href="@{'/usuario/livro/' + ${livro.isbn}}" class="btn-back">Cancelar e Voltar ao Acervo</a>
        </form>
    </div>
</div>

</body>
</html>
