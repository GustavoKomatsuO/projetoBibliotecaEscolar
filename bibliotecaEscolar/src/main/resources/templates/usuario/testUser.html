<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Bibliográfico - IGP3</title>
    <link rel="stylesheet" th:href="@{/usuarioStyle.css}">
    <style>
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 0; }
        .book-card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-4px); }
        .book-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
        .book-card h3 { font-size: 1.1rem; margin: 10px 0 5px; color: #002b5c; }
        .tag { background: #e2e8f0; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; }
    </style>
</head>
<body>

<header class="header-content">
    <span class="header-badge">Biblioteca Digital</span>
    <h1>IGP3 - Acervo Bibliográfico</h1>
</header>

<main class="library-container">
    <section class="search-section">
        <input type="text" id="searchInput" placeholder="Pesquisar por título do livro..." onkeyup="filtrarLivros()" />
        <select id="categoryFilter" onchange="filtrarLivros()">
            <option value="todos">Todas as Categorias</option>
            <option value="Ficção / Literatura">Ficção / Literatura</option>
            <option value="Filosofia">Filosofia</option>
            <option value="Política / História">Política / História</option>
            <option value="Ciência">Ciência</option>
            <option value="Psicologia">Psicologia</option>
            <option value="Economia">Economia</option>
            <option value="Mangá">Mangá</option>
        </select>
    </section>

    <section class="book-grid" id="booksGrid">
        <!-- O Livro só é gerado aqui se a lista de exemplares NÃO for vazia -->
        <div class="book-card" th:each="livro : ${livros}"
             th:if="${not #lists.isEmpty(livro.exemplares)}"
             th:data-titulo="${livro.titulo}"
             th:data-categoria="${livro.categoria}"
             th:onclick="'window.location.href=\'/usuario/livro/' + ${livro.isbn} + '\''">

            <img th:src="${livro.urlImagem != null and !livro.urlImagem.isEmpty() ? livro.urlImagem : 'https://via.placeholder.com/150x220?text=Capa+do+Livro'}" th:alt="${livro.titulo}" />

            <h3 th:text="${livro.titulo}">Título do Livro</h3>
            <p th:text="${livro.editora}">Editora</p>
            <span class="tag" th:text="${livro.categoria}">Categoria</span>
        </div>
    </section>
</main>

<script>
    function filtrarLivros() {
        const busca = document.getElementById('searchInput').value.toLowerCase();
        const categoriaSel = document.getElementById('categoryFilter').value;
        const cards = document.querySelectorAll('.book-card');

        cards.forEach(card => {
            const titulo = card.getAttribute('data-titulo').toLowerCase();
            const categoria = card.getAttribute('data-categoria');

            const bateBusca = titulo.includes(busca);
            const bateCategoria = (categoriaSel === 'todos' || categoria === categoriaSel);

            if (bateBusca && bateCategoria) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>

</body>
</html>
