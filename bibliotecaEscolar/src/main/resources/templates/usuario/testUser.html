<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Bibliográfico - IGP3</title>
    <link rel="stylesheet" th:href="@{/usuario/usuarioStyle.css}">
</head>
<body>
<header class="header-content">
    <h1>IGP3 - Acervo Bibliográfico</h1>
    <div class="header-right">
        <span class="welcome-msg">Bem-vindo(a), <strong><span th:text="${usuarioNome}">Usuário</span>!</strong></span>
        <span class="header-badge">Biblioteca Digital</span>
    </div>
</header>

<div class="main-layout">
    <aside class="sidebar">
        <a th:href="@{/usuario/testUser}" class="sidebar-item active" data-tooltip="Home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <a th:href="@{/usuario/emprestimos}" class="sidebar-item" data-tooltip="Meus Empréstimos">
            <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
        </a>
        <a th:href="@{/usuario/historico}" class="sidebar-item" data-tooltip="Histórico">
            <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 6.97 6.97 0 0 1-5-2.14l-1.42 1.42A8.92 8.92 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </a>
        <a th:href="@{/logout}" class="sidebar-item sidebar-logout" data-tooltip="Sair">
            <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </a>
    </aside>

    <main class="library-container">
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Pesquisar por título do livro..." onkeyup="filtrarLivros()" />
            <select id="categoryFilter" onchange="filtrarLivros()">
                <option value="todos">Todas as Categorias</option>
                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
            </select>
        </section>

        <section class="book-grid" id="booksGrid">
            <a class="book-card" th:each="livro : ${livros}"
               th:if="${not #lists.isEmpty(livro.exemplares)}"
               th:href="@{'/usuario/livro/' + ${livro.isbn}}"
               th:data-titulo="${livro.titulo}"
               th:data-categoria="${livro.categoria}">

                <img th:src="${livro.urlImagem != null and !livro.urlImagem.isEmpty() ? livro.urlImagem : 'https://via.placeholder.com/150x220?text=Capa+do+Livro'}" th:alt="${livro.titulo}" />
                <h3 th:text="${livro.titulo}">Título</h3>
                <p th:text="${livro.editora}">Editora</p>
                <span class="tag" th:text="${livro.categoria}">Categoria</span>
            </a>
        </section>
    </main>
</div>

<script>
    function filtrarLivros() {
        const busca = document.getElementById('searchInput').value.toLowerCase();
        const categoriaSel = document.getElementById('categoryFilter').value;
        const cards = document.querySelectorAll('.book-card');

        cards.forEach(card => {
            const titulo = card.getAttribute('data-titulo').toLowerCase();
            const categoria = card.getAttribute('data-categoria');
            const bateBusca = titulo.includes(busca);
            const bateCategoria = (categoriaSel === 'todos' || categoria === categoriaSel);
            card.style.display = (bateBusca && bateCategoria) ? 'block' : 'none';
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        const alerts = document.querySelectorAll(".alert");
        alerts.forEach(alert => {
            setTimeout(() => {
                alert.style.transition = "opacity 0.5s ease";
                alert.style.opacity = "0";
                setTimeout(() => alert.remove(), 500);
            }, 7000);
        });
    });
</script>
</body>
</html>
