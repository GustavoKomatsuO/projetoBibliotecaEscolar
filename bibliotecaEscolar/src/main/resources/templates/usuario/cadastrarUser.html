<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Biblioteca Escolar</title>
</head>
<body>
<h2>Criar Nova Conta</h2>

<p th:if="${erro}" th:text="${erro}" style="color: red;"></p>

<form th:action="@{/cadastrar/salvar}" method="post">
    <div>
        <label>Nome Completo:</label>
        <input type="text" name="nome" placeholder="Digite seu nome completo" required />
    </div>
    <br>
    <div>
        <label>CPF:</label>
        <input type="text" name="cpf" placeholder="Digite seu CPF" required />
    </div>
    <br>
    <div>
        <label>E-mail:</label>
        <input type="email" name="email" placeholder="seuemail@exemplo.com" required />
    </div>
    <br>
    <div>
        <label>Telefone / Celular:</label>
        <input type="text" name="telefone" placeholder="(00) 00000-0000" />
    </div>
    <br>
    <div>
        <label>Data de Nascimento:</label>
        <input type="date" name="dataNascimento" />
    </div>
    <br>
    <div>
        <label>Tipo de Perfil:</label>
        <select name="tipoUsuario" required>
            <option value="ALUNO">Aluno</option>
            <option value="FUNCIONARIO">Funcionário / Bibliotecário</option>
        </select>
    </div>
    <br>
    <div>
        <label>Senha:</label>
        <input type="password" name="senha" required />
    </div>
    <br>
    <div>
        <label>Confirme a Senha:</label>
        <input type="password" name="confirmarSenha" required />
    </div>
    <br>
    <button type="submit">Cadastrar</button>
</form>

<br>
<a th:href="@{/login}">Já tem uma conta? Faça Login</a>
</body>
</html>
