<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro IGP3 - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/usuario/cadastro.css}">
</head>
<body>

<main class="login-card">
    <header>
        <h1>Cadastro IGP3</h1>
        <p>Preencha os dados abaixo para criar sua conta</p>
    </header>

    <form th:action="@{/cadastrar/salvar}" method="post">

        <p th:if="${erro}" th:text="${erro}" style="color: red; font-weight: bold; text-align: center;"></p>

        <div class="input-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            <p id="cpf-error" class="error-message" aria-live="polite" style="color: red; font-size: 0.85rem; margin-top: 4px; display: none;"></p>
        </div>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
            <label for="senha">Criar Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="input-group">
            <label for="confirmar-senha">Confirmar Senha</label>
            <input type="password" id="confirmar-senha" name="confirmarSenha" placeholder="Repita a senha" required>
            <p id="senha-error" class="error-message" aria-live="polite" style="color: red; font-size: 0.85rem; margin-top: 4px; display: none;"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn-submit">Criar Conta</button>
            <a th:href="@{/login}" class="forgot-link">Já tem uma conta? Voltar ao Login</a>
        </div>
    </form>

    <footer>
        <p class="footer-text">Em caso de dúvidas, entre em contato com o suporte.</p>
    </footer>
</main>

<script>
    const form = document.querySelector('form');
    const senha = document.getElementById('senha');
    const confirmarSenha = document.getElementById('confirmar-senha');
    const erroSenha = document.getElementById('senha-error');
    const inputCpf = document.getElementById('cpf');
    const erroCpf = document.getElementById('cpf-error');

    function aplicarMascaraCPF(valor) {
        return valor
            .replace(/\D/g, '')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    }

    function validarCPF(cpf) {
        cpf = cpf.replace(/[^\d]+/g, '');
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

        let soma = 0;
        for (let i = 0; i < 9; i++) {
            soma += parseInt(cpf.charAt(i)) * (10 - i);
        }
        let resto = 11 - (soma % 11);
        let digito1 = (resto >= 10) ? 0 : resto;
        if (digito1 !== parseInt(cpf.charAt(9))) return false;

        soma = 0;
        for (let i = 0; i < 10; i++) {
            soma += parseInt(cpf.charAt(i)) * (11 - i);
        }
        resto = 11 - (soma % 11);
        let digito2 = (resto >= 10) ? 0 : resto;

        return digito2 === parseInt(cpf.charAt(10));
    }

    inputCpf.addEventListener('input', function (e) {
        e.target.value = aplicarMascaraCPF(e.target.value);
        if (e.target.value.length === 14) {
            if (!validarCPF(e.target.value)) {
                erroCpf.textContent = 'CPF inválido.';
                erroCpf.style.display = 'block';
            } else {
                erroCpf.textContent = '';
                erroCpf.style.display = 'none';
            }
        } else {
            erroCpf.textContent = '';
            erroCpf.style.display = 'none';
        }
    });

    form.addEventListener('submit', function (e) {
        let valido = true;

        if (!validarCPF(inputCpf.value)) {
            e.preventDefault();
            erroCpf.textContent = 'Informe um CPF válido.';
            erroCpf.style.display = 'block';
            inputCpf.focus();
            valido = false;
        } else {
            erroCpf.textContent = '';
            erroCpf.style.display = 'none';
        }

        if (senha.value !== confirmarSenha.value) {
            e.preventDefault();
            erroSenha.textContent = 'As senhas não coincidem.';
            erroSenha.style.display = 'block';
            if (valido) {
                confirmarSenha.focus();
            }
            confirmarSenha.setAttribute('aria-invalid', 'true');
        } else {
            erroSenha.textContent = '';
            erroSenha.style.display = 'none';
            confirmarSenha.removeAttribute('aria-invalid');
        }
    });

    confirmarSenha.addEventListener('input', function () {
        if (senha.value && confirmarSenha.value && senha.value !== confirmarSenha.value) {
            erroSenha.textContent = 'As senhas não coincidem.';
            erroSenha.style.display = 'block';
        } else {
            erroSenha.textContent = '';
            erroSenha.style.display = 'none';
        }
    });
</script>
</body>
</html>
