<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro IGP3 - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/usuario/cadastro.css}">
</head>
<body>

<main class="login-card">
    <header>
        <h1>Cadastro IGP3</h1>
        <p>Preencha os dados abaixo para criar sua conta</p>
    </header>

    <form th:action="@{/cadastrar/salvar}" method="post">

        <p th:if="${erro}" th:text="${erro}" style="color: red; font-weight: bold; text-align: center;"></p>

        <div class="input-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
            <label for="senha">Criar Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="input-group">
            <label for="confirmar-senha">Confirmar Senha</label>
            <input type="password" id="confirmar-senha" name="confirmarSenha" placeholder="Repita a senha" required>
            <p id="senha-error" class="error-message" aria-live="polite" style="color: red; font-size: 0.85rem; margin-top: 4px;"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn-submit">Criar Conta</button>
            <a th:href="@{/login}" class="forgot-link">Já tem uma conta? Voltar ao Login</a>
        </div>
    </form>

    <footer>
        <p class="footer-text">Em caso de dúvidas, entre em contato com o suporte.</p>
    </footer>
</main>

<script>
    const form = document.querySelector('form');
    const senha = document.getElementById('senha');
    const confirmarSenha = document.getElementById('confirmar-senha');
    const erroSenha = document.getElementById('senha-error');

    form.addEventListener('submit', function (e) {
        if (senha.value !== confirmarSenha.value) {
            e.preventDefault();
            erroSenha.textContent = 'As senhas não coincidem.';
            confirmarSenha.focus();
            confirmarSenha.setAttribute('aria-invalid', 'true');
        } else {
            erroSenha.textContent = '';
            confirmarSenha.removeAttribute('aria-invalid');
        }
    });

    confirmarSenha.addEventListener('input', function () {
        if (senha.value && confirmarSenha.value && senha.value !== confirmarSenha.value) {
            erroSenha.textContent = 'As senhas não coincidem.';
        } else {
            erroSenha.textContent = '';
        }
    });
</script>
</body>
</html>
