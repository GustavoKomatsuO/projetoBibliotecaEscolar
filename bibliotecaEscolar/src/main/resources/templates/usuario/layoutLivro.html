<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${livro.titulo} + ' - IGP3'">Detalhes do Livro - IGP3</title>
    <link rel="stylesheet" th:href="@{/usuario/layoutLivro.css}">
</head>
<body>

<header class="header-content">
    <h1>IGP3 - Detalhes do Livro</h1>
    <div class="header-right">
        <span class="welcome-msg">Bem-vindo(a), <strong><span th:text="${usuarioNome}">Usuário</span>!</strong></span>
        <span class="header-badge">Biblioteca Digital</span>
    </div>
</header>

<div class="main-layout">
    <aside class="sidebar">
        <a th:href="@{/usuario/testUser}" class="sidebar-item" data-tooltip="Home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <a th:href="@{/usuario/emprestimos}" class="sidebar-item" data-tooltip="Meus Empréstimos">
            <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
        </a>
        <a th:href="@{/logout}" class="sidebar-item sidebar-logout" data-tooltip="Sair">
            <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </a>
    </aside>

    <main class="content-container">
        <div style="width: 100%; max-width: 900px;">
            <!-- ALERTAS DE ERRO -->
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <div class="book-details-card">
                <img class="book-cover" th:src="${livro.urlImagem != null and !livro.urlImagem.isEmpty() ? livro.urlImagem : 'https://via.placeholder.com/280x400?text=Capa+do+Livro'}" th:alt="${livro.titulo}" />

                <div class="book-info">
                    <h2 th:text="${livro.titulo}">Título do Livro</h2>
                    <p><strong>Autor:</strong> <span th:text="${livro.autor}">Autor</span></p>
                    <p><strong>Editora:</strong> <span th:text="${livro.editora}">Editora</span></p>
                    <p><strong>Ano de Publicação:</strong> <span th:text="${livro.anoPublicacao}">Ano</span></p>
                    <p><strong>Categoria:</strong> <span th:text="${livro.categoria}">Categoria</span></p>
                    <p><strong>Categoria Restrição:</strong> <span th:text="${livro.categoriaRestricao}">PADRAO</span></p>
                    <p><strong>Sinopse:</strong> <span th:text="${livro.sinopse != null and !livro.sinopse.isEmpty() ? livro.sinopse : 'Nenhuma sinopse cadastrada.'}">Sinopse</span></p>

                    <p>
                        <strong>Status do Acervo:</strong>
                        <span th:class="${status == 'DISPONIVEL' ? 'badge-status badge-disponivel' : 'badge-status badge-indisponivel'}" th:text="${status}">DISPONIVEL</span>
                    </p>

                    <div class="actions-group">
                        <form th:if="${status == 'DISPONIVEL'}" th:action="@{/usuario/efetuar-emprestimo}" method="post" style="display: inline;">
                            <input type="hidden" name="isbn" th:value="${livro.isbn}" />
                            <button type="submit" class="btn-action btn-emprestar">Pegar Empréstimo</button>
                        </form>
                        <a th:href="@{'/usuario/reserva/' + ${livro.isbn}}" class="btn-action btn-reservar">Fazer Reserva</a>
                        <a th:href="@{/usuario/testUser}" class="btn-action btn-voltar">Voltar ao Acervo</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
