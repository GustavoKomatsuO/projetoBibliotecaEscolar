<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Leitura - IGP3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

    .header-content { background-color: #002b5c; color: white; width: 100%; height: 75px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: fixed; top: 0; left: 0; z-index: 1000; }
    .header-content h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .welcome-msg { font-size: 1.05rem; font-weight: 500; }
    .header-badge { background-color: #ffd166; color: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }

    .main-layout { display: flex; margin-top: 75px; width: 100%; flex: 1; }
    .sidebar { width: 75px; background-color: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; padding-top: 25px; position: fixed; top: 75px; bottom: 0; left: 0; z-index: 900; }
    .sidebar-item { position: relative; width: 50px; height: 50px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #475569; text-decoration: none; transition: 0.2s; cursor: pointer; }
    .sidebar-item svg { width: 24px; height: 24px; fill: currentColor; }
    .sidebar-item:hover, .sidebar-item.active { background-color: #002b5c; color: #ffd166; }

    .sidebar-logout { margin-top: auto; margin-bottom: 25px; background-color: #dc2626 !important; color: white !important; }
    .sidebar-logout:hover { background-color: #b91c1c !important; }

    .sidebar-item::after { content: attr(data-tooltip); position: absolute; left: 80px; background-color: #1e293b; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.15); z-index: 1100; pointer-events: none; }
    .sidebar-item:hover::after { opacity: 1; visibility: visible; }

    .container { margin-left: 75px; padding: 30px; flex: 1; width: calc(100% - 75px); }
    h2 { color: #002b5c; margin-bottom: 20px; font-size: 1.6rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;}

    .table-wrapper { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; }
    th { background-color: #f8fafc; color: #475569; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; }
    td { color: #1e293b; font-size: 0.95rem; }
    tr:last-child td { border-bottom: none; }

    .empty-msg { padding: 20px; color: #64748b; font-style: italic; text-align: center; }

    .alert { padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; text-align: center; }
    .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
    .alert-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
  </style>
</head>
<body>

<header class="header-content">
  <h1>IGP3 - Acervo Bibliográfico</h1>
  <div class="header-right">
    <span class="welcome-msg">Bem-vindo(a), <strong><span th:text="${usuarioNome}">Usuário</span>!</strong></span>
    <span class="header-badge">Biblioteca Digital</span>
  </div>
</header>

<div class="main-layout">
  <aside class="sidebar">
    <a th:href="@{/usuario/testUser}" class="sidebar-item" data-tooltip="Home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <a th:href="@{/usuario/emprestimos}" class="sidebar-item" data-tooltip="Meus Empréstimos">
      <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
    </a>
    <a th:href="@{/usuario/historico}" class="sidebar-item active" data-tooltip="Histórico">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 6.97 6.97 0 0 1-5-2.14l-1.42 1.42A8.92 8.92 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </a>
    <a th:href="@{/logout}" class="sidebar-item sidebar-logout" data-tooltip="Sair">
      <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
    </a>
  </aside>

  <main class="container">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <h2>Histórico de Livros Lidos</h2>
    <div class="table-wrapper">
      <table>
        <thead>
        <tr>
          <th>Livro</th>
          <th>Último Empréstimo</th>
          <th>Data Devolução</th>
          <th>Status Final</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${historicoEmprestimos}">
          <td th:text="${emp.exemplar.livro.titulo}">Título do Livro</td>
          <td th:text="${emp.dataAlugada}">00/00/0000</td>
          <td th:text="${emp.dataDevolucao != null ? emp.dataDevolucao : 'Devolvido'}">00/00/0000</td>
          <td>
            <span style="color: #065f46; font-weight: bold;" th:text="${emp.status}">DEVOLVIDO</span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(historicoEmprestimos)}">
          <td colspan="4" class="empty-msg">Nenhum histórico de empréstimo concluído encontrado.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const alerts = document.querySelectorAll(".alert");
    alerts.forEach(alert => {
      setTimeout(() => {
        alert.style.transition = "opacity 0.5s ease";
        alert.style.opacity = "0";
        setTimeout(() => alert.remove(), 500);
      }, 7000);
    });
  });
</script>
</body>
</html>
